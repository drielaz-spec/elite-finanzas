<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #000; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; }
      #footage { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; object-fit: cover; }
      #scrim { position: absolute; left: 0; top: 0; width: 1080px; height: 820px; z-index: 2;
                background: linear-gradient(to bottom, rgba(0,0,0,.42) 0%, rgba(0,0,0,.22) 55%, rgba(0,0,0,0) 100%); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="12.0" data-width="1080" data-height="1920">
      <video id="footage" class="clip" src="assets/demo.mp4" data-start="0" data-duration="12.0" data-track-index="0"
             playsinline data-has-audio="true" data-volume="1"></video>
      <div id="scrim" class="clip" data-start="0" data-duration="12.0" data-track-index="1" data-layout-ignore></div>
      <div id="gancho" data-composition-id="gancho" data-composition-src="compositions/gancho.html" data-start="0.4" data-duration="4.7" data-track-index="2" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index:3"></div>
      <div id="dia1" data-composition-id="dia1" data-composition-src="compositions/dia1.html" data-start="5.3" data-duration="3.1" data-track-index="2" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index:3"></div>
      <div id="dia12" data-composition-id="dia12" data-composition-src="compositions/dia12.html" data-start="8.5" data-duration="3.5" data-track-index="2" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index:3"></div>
      <div id="palabras" data-composition-id="palabras" data-composition-src="compositions/palabras.html" data-start="0"
           data-duration="12.0" data-track-index="3" data-track-kind="captions" data-width="1080" data-height="1920" style="z-index:4"></div>
    </div>
    <script>
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
